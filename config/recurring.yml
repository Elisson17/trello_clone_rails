development: &tasks
  due_soon:
    class: DueSoonReminderJob
    queue: notifications
    schedule: every hour
  purge_archived:
    class: PurgeArchivedJob
    queue: maintenance
    schedule: at 4am every day

production:
  <<: *tasks
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    queue: maintenance
    schedule: every hour at minute 12
