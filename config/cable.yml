# Solid Cable em desenvolvimento também: o banco `cable` é o mesmo mecanismo da produção,
# então duas abas sincronizam local pelo mesmo caminho que vai sincronizar no deploy.
# O adapter `async` seria mais barato, mas só funciona dentro de um processo — e o
# broadcast sai de um job, não do request.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
