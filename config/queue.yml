default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [ default, notifications ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    - queues: [ maintenance ]
      threads: 1
      polling_interval: 5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
